; fsk-walkie-talkie — LilyGo T3-S3 (SX1262) + T3-S3-MVSRBoard
;
; Before first build, fetch the LilyGo Arduino_DriveBus library into lib/:
;   ./scripts/fetch_deps.sh        (git + bash; see README for the manual way)

[platformio]
default_envs = t3s3_sx1262
src_dir = src
lib_dir = lib

[env:t3s3_sx1262]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB

build_flags =
    -Wall
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=0        ; loop() = radio + button on core 0
    -D ARDUINO_EVENT_RUNNING_CORE=0  ; audio tasks are pinned to core 1
    ; -D T3_S3_MVSRBoard_V1_0   ; uncomment for the V1.0 back plate (MSM261 mic)

lib_deps =
    jgromes/RadioLib @ 7.1.2
    https://github.com/sh123/esp32_codec2_arduino.git#1.0.7
    ; Arduino_DriveBus lives in lib/ (fetched by scripts/fetch_deps.sh)

; Same firmware plus a link-time malloc/calloc/realloc counter armed at the
; end of setup(). The listen-mode stats line then reports heap_allocs, which
; must stay 0 across talk/listen cycles.
[env:t3s3_sx1262_heapaudit]
extends = env:t3s3_sx1262
build_flags =
    ${env:t3s3_sx1262.build_flags}
    -D HEAP_AUDIT
    -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc
